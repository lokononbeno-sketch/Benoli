<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5d3b">
<title>Benoli Littéraire</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --papier:#f3f5f0; --carte:#ffffff; --encre:#12201a; --doux:#58665e; --trait:#dbe2d9;
  --vert:#0b5d3b; --or:#f2b01e; --rouge:#b8442b; --sur-vert:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{--papier:#0e1511; --carte:#17211b; --encre:#eef3ec; --doux:#9fb0a5; --trait:#27352d; --vert:#1f9a62; --sur-vert:#06150d}
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:12px}
body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--papier);color:var(--encre);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
body.fige{overflow:hidden}
.serif,h1,h2,h3{font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* Accueil */
header.hero{padding:34px 0 22px}
.drapeau{display:flex;height:5px;width:84px;border-radius:3px;overflow:hidden;margin-bottom:18px}
.drapeau i{flex:1}.drapeau i:nth-child(1){background:var(--vert)}.drapeau i:nth-child(2){background:var(--or)}.drapeau i:nth-child(3){background:var(--rouge)}
h1{font-size:clamp(2.3rem,11vw,3.6rem);line-height:1.02;letter-spacing:-.02em;font-weight:700}
.sous{margin-top:12px;color:var(--doux);max-width:34ch}
.auteur{margin-top:20px;padding:14px 16px;border-left:4px solid var(--or);background:var(--carte);border-radius:0 10px 10px 0;font-size:.95rem}
.auteur b{display:block;font-family:Georgia,serif;font-size:1.05rem}

/* Recherche */
.recherche{position:sticky;top:0;z-index:5;background:var(--papier);padding:10px 0 12px}
.recherche input{width:100%;font:inherit;padding:13px 16px;border-radius:12px;border:1.5px solid var(--trait);background:var(--carte);color:var(--encre)}
.recherche input:focus{outline:3px solid var(--or);border-color:transparent}
.nb{color:var(--doux);font-size:.88rem;margin:4px 2px 12px}

/* Catalogue */
.grille{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding-bottom:28px}
@media(min-width:620px){.grille{grid-template-columns:repeat(3,1fr)}}
.livre{text-decoration:none;display:block}
.livre:focus-visible{outline:3px solid var(--or);outline-offset:4px;border-radius:8px}
.cv{aspect-ratio:2/3;border-radius:4px 10px 10px 4px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,hsl(var(--h) 48% 26%),hsl(calc(var(--h) + 28) 52% 13%));
  box-shadow:inset 6px 0 0 rgba(255,255,255,.14),0 6px 14px rgba(0,0,0,.18);
  display:flex;align-items:flex-end;padding:14px 12px 16px;color:#fff}
.cv span{font-family:Georgia,serif;font-weight:700;font-size:1.12rem;line-height:1.12;text-wrap:balance}
.cv::after{content:"";position:absolute;top:0;right:12px;width:6px;height:22px;background:var(--or)}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.livre h3{margin-top:10px;font-size:1rem;line-height:1.25}
.livre p{color:var(--doux);font-size:.88rem;margin-top:2px}
.vide{grid-column:1/-1;color:var(--doux);padding:24px 0}

/* Fiche */
#fiche{position:fixed;inset:0;z-index:20;background:var(--papier);overflow-y:auto;display:none;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#fiche.ouverte{display:block;animation:monte .22s ease-out}
@keyframes monte{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){#fiche.ouverte{animation:none}}
.retour{display:inline-block;margin:14px 0;padding:10px 14px;border-radius:10px;background:var(--carte);text-decoration:none;font-weight:600;border:1px solid var(--trait)}
.haut{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:end;margin-bottom:20px}
.haut .cv{box-shadow:inset 6px 0 0 rgba(255,255,255,.14),0 8px 18px rgba(0,0,0,.22)}
.haut .cv span{font-size:.95rem}
.haut h2{font-size:1.55rem;line-height:1.1}
.haut .ss{color:var(--doux);margin-top:6px;font-style:italic}
.etiq{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:99px;background:var(--carte);border:1px solid var(--trait);font-size:.82rem;color:var(--doux)}
.bloc{margin:22px 0}
.bloc h3{font-size:1.15rem;margin-bottom:8px}
.bloc p{margin-bottom:10px;max-width:62ch}
.attente{color:var(--doux);font-style:italic}
.extrait{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:16px}
.actions{display:grid;gap:10px;margin:24px 0 40px}
.btn{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:700;padding:15px 18px;border-radius:12px;border:2px solid var(--vert);background:var(--vert);color:var(--sur-vert)}
.btn.off{background:transparent;color:var(--doux);border-color:var(--trait);border-style:dashed}
.btn.sec{background:transparent;color:var(--vert)}
.btn:focus-visible{outline:3px solid var(--or);outline-offset:2px}
footer{border-top:1px solid var(--trait);padding:22px 0 36px;color:var(--doux);font-size:.88rem}

/* Assistant */
#aBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:15;border:0;border-radius:99px;padding:13px 18px;font:inherit;font-weight:700;background:var(--or);color:#2a1e00;box-shadow:0 6px 16px rgba(0,0,0,.28);cursor:pointer}
#aBtn:focus-visible,#aFermer:focus-visible,.chip:focus-visible,#aForm button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
#assistant{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;flex-direction:column;height:min(82vh,640px);max-width:560px;margin:0 auto;background:var(--papier);border-radius:18px 18px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.28)}
#assistant.ouvert{display:flex}
.aHaut{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--trait)}
#aFermer{border:0;background:transparent;color:var(--encre);font-size:1.2rem;padding:6px 10px;cursor:pointer}
#aMsgs{flex:1;overflow-y:auto;padding:8px 14px}
.m{max-width:88%;padding:10px 13px;border-radius:14px;margin:8px 0;font-size:.95rem}
.m.bot{background:var(--carte);border:1px solid var(--trait)}
.m.moi{background:var(--vert);color:var(--sur-vert);margin-left:auto}
.m p{margin-bottom:6px}.m p:last-child{margin-bottom:0}
.m a{color:var(--vert);font-weight:700}
.m ul{padding-left:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 14px}
.chip{flex:none;border:1.5px solid var(--vert);background:transparent;color:var(--vert);border-radius:99px;padding:8px 14px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
#aForm{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
#aForm input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--trait);background:var(--carte);color:var(--encre)}
#aForm button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:0 16px;background:var(--vert);color:var(--sur-vert);cursor:pointer}
</style>
</head>
<body>

<header class="hero"><div class="wrap">
  <div class="drapeau" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1 class="serif">Benoli<br>Littéraire</h1>
  <p class="sous">Les romans de Benoli, made in Bénin. Lisez un extrait gratuit, puis choisissez votre histoire.</p>
  <div class="auteur"><b id="nomAuteur"></b>Auteur béninois. Chaque roman est disponible en version numérique.</div>
</div></header>

<main class="wrap" id="catalogue">
  <div class="recherche"><input id="q" type="search" placeholder="Chercher un titre ou un mot-clé" autocomplete="off" aria-label="Chercher un roman"></div>
  <p class="nb" id="nb"></p>
  <div class="grille" id="grille"></div>
</main>

<footer><div class="wrap">
  © <span id="annee"></span> Benoli Littéraire. Tous droits réservés.
</div></footer>

<section id="fiche" aria-label="Fiche du roman"><div class="wrap" id="ficheContenu"></div></section>

<button id="aBtn" type="button" aria-label="Ouvrir l'assistant">💬 Assistant</button>
<section id="assistant" role="dialog" aria-label="Assistant littéraire">
  <div class="aHaut"><b class="serif" id="aTitre"></b><button id="aFermer" type="button" aria-label="Fermer">✕</button></div>
  <div id="aMsgs" aria-live="polite"></div>
  <div class="chips" id="aChips"></div>
  <form id="aForm"><input id="aIn" type="text" placeholder="Pose ta question" autocomplete="off" aria-label="Ta question"><button type="submit">Envoyer</button></form>
</section>

<script>
/* =====================================================================
   1. RÉGLAGES — modifie ici
   ===================================================================== */
const CONFIG = {
  auteur: "Benoli",
  whatsapp: "2290149293939"   // numéro sans + ni espaces
};

/* Textes de l'ASSISTANT — modifie-les comme tu veux.
   (Les résumés qu'il donne viennent du champ "resume" de chaque roman.) */
const ASSISTANT = {
  nom: "Assistant Benoli",
  achat: "Ouvre la fiche du roman, puis touche « Acheter ». Tu arrives sur la page de paiement : suis les instructions affichées.",
  lecture: "Chaque fiche contient un extrait gratuit. Lis-le avant d'acheter pour savoir si l'histoire te plaît.",
  regles: [
    "Le roman acheté est pour toi seul : ne le partage pas et ne le revends pas.",
    "Ne copie pas le texte pour le publier ailleurs.",
    "Garde bien le lien ou le fichier reçu après ton achat.",
    "En cas de problème de paiement ou d'accès, écris à Benoli sur WhatsApp."
  ]
};

/* =====================================================================
   2. CATALOGUE — pour AJOUTER un roman : copie un bloc { ... }, colle-le
      à la fin de la liste (avec une virgule), change l'id et les textes.
      - couverture : mets le nom du fichier image (ex: "couvertures/cobi.jpg")
      - lienAchat  : mets le lien de la page de vente (Chariow, Paychap...)
      - resume / extrait : colle ton vrai texte entre les guillemets
        (pour sauter une ligne dans l'extrait, écris \n)
   ===================================================================== */
const ROMANS = [
  { id:"elle-m-appelait-checo", titre:"Elle m'appelait Chéco", sousTitre:"Je croyais être son amie jusqu'à ce regard.",
    genre:"Roman", prix:1000, couverture:"", lienAchat:"", resume:"", extrait:"" },
  { id:"cobi", titre:"Cobi", sousTitre:"Et si l'amour ne suffisait pas à nous sauver ?",
    genre:"Roman", prix:1000, couverture:"", lienAchat:"", resume:"", extrait:"" },
  { id:"je-ne-suis-pas-ce-qu-ils-ont-fait-de-moi", titre:"Je ne suis pas ce qu'ils ont fait de moi", sousTitre:"",
    genre:"Roman", prix:1000, couverture:"", lienAchat:"", resume:"", extrait:"" },
  { id:"ce-que-tu-m-as-coute", titre:"Ce que tu m'as coûté", sousTitre:"",
    genre:"Roman", prix:1000, couverture:"", lienAchat:"", resume:"", extrait:"" },
  { id:"elle-choisit-mal", titre:"Elle choisit mal, mais c'est ta faute", sousTitre:"",
    genre:"Roman", prix:1000, couverture:"", lienAchat:"", resume:"", extrait:"" },
  { id:"la-maison-d-en-face", titre:"La Maison d'en face", sousTitre:"",
    genre:"Roman", prix:1000, couverture:"", lienAchat:"", resume:"", extrait:"" },
  { id:"le-coeur-de-fridaous", titre:"Le Cœur de Fridaous", sousTitre:"",
    genre:"Roman", prix:1000, couverture:"", lienAchat:"", resume:"", extrait:"" }
];

/* =====================================================================
   3. PROGRAMME — pas besoin d'y toucher
   ===================================================================== */
const $ = s => document.querySelector(s);
const norm = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/œ/g, "oe");
const esc = s => (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const prix = n => n.toLocaleString("fr-FR") + " FCFA";

function couverture(r, i) {
  const img = r.couverture ? `<img src="${esc(r.couverture)}" alt="Couverture de ${esc(r.titre)}" loading="lazy">` : "";
  return `<div class="cv" style="--h:${(i * 47 + 150) % 360}">${r.couverture ? img : `<span>${esc(r.titre)}</span>`}</div>`;
}

function afficherListe() {
  const q = norm($("#q").value.trim());
  const liste = ROMANS.map((r, i) => ({ r, i })).filter(({ r }) =>
    norm([r.titre, r.sousTitre, r.genre, r.resume].join(" ")).includes(q));
  $("#nb").textContent = q ? `${liste.length} résultat(s)` : `${ROMANS.length} romans`;
  $("#grille").innerHTML = liste.length ? liste.map(({ r, i }) => `
    <a class="livre" href="#/${r.id}">
      ${couverture(r, i)}
      <h3 class="serif">${esc(r.titre)}</h3>
      <p>${prix(r.prix)}</p>
    </a>`).join("") : `<p class="vide">Aucun roman ne correspond. Essaie un autre mot.</p>`;
}

function afficherFiche(id) {
  const i = ROMANS.findIndex(r => r.id === id);
  if (i < 0) return fermerFiche();
  const r = ROMANS[i];
  const wa = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent("Bonjour, je suis intéressé(e) par « " + r.titre + " ».")}`;
  const paragraphes = t => t.split("\n").filter(Boolean).map(p => `<p>${esc(p)}</p>`).join("");
  $("#ficheContenu").innerHTML = `
    <a class="retour" href="#">← Catalogue</a>
    <div class="haut">
      ${couverture(r, i)}
      <div>
        <h2>${esc(r.titre)}</h2>
        ${r.sousTitre ? `<p class="ss">${esc(r.sousTitre)}</p>` : ""}
        <span class="etiq">${esc(r.genre)} · ${prix(r.prix)}</span>
      </div>
    </div>
    <div class="bloc"><h3>Résumé</h3>${r.resume ? paragraphes(r.resume) : `<p class="attente">Le résumé arrive bientôt.</p>`}</div>
    <div class="bloc"><h3>Extrait gratuit</h3>
      <div class="extrait">${r.extrait ? paragraphes(r.extrait) : `<p class="attente">L'extrait gratuit arrive bientôt.</p>`}</div>
    </div>
    <div class="actions">
      ${r.lienAchat
        ? `<a class="btn" href="${esc(r.lienAchat)}" target="_blank" rel="noopener">Acheter le roman · ${prix(r.prix)}</a>`
        : `<span class="btn off">Achat bientôt disponible</span>`}
      <a class="btn sec" href="${wa}" target="_blank" rel="noopener">Poser une question sur WhatsApp</a>
    </div>`;
  $("#fiche").classList.add("ouverte");
  $("#fiche").scrollTop = 0;
  document.body.classList.add("fige");
  document.title = r.titre + " · Benoli Littéraire";
}

function fermerFiche() {
  $("#fiche").classList.remove("ouverte");
  document.body.classList.remove("fige");
  document.title = "Benoli Littéraire";
}

function route() {
  const m = location.hash.match(/^#\/(.+)$/);
  m ? afficherFiche(decodeURIComponent(m[1])) : fermerFiche();
}

$("#nomAuteur").textContent = CONFIG.auteur;
$("#annee").textContent = new Date().getFullYear();
$("#q").addEventListener("input", afficherListe);
window.addEventListener("hashchange", route);

/* ---------- Assistant ---------- */
const aPanel = $("#assistant"), aMsgs = $("#aMsgs"), aIn = $("#aIn");
const lien = r => `<a href="#/${r.id}">${esc(r.titre)}</a>`;
const liste = () => "<ul>" + ROMANS.map(r => `<li>${lien(r)}</li>`).join("") + "</ul>";
const mini = Math.min(...ROMANS.map(r => r.prix));
const mots = s => norm(s).replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w.length >= 4 && !["elle", "mais", "pour", "dans", "avec", "quel", "quels", "comment", "veux", "voir", "parle", "moi"].includes(w));

function aDire(html) { const d = document.createElement("div"); d.className = "m bot"; d.innerHTML = html; aMsgs.appendChild(d); aMsgs.scrollTop = aMsgs.scrollHeight; }
function aUser(t) { const d = document.createElement("div"); d.className = "m moi"; d.textContent = t; aMsgs.appendChild(d); aMsgs.scrollTop = aMsgs.scrollHeight; }
function aOuvrir(o) {
  aPanel.classList.toggle("ouvert", o);
  $("#aBtn").hidden = o;
  if (o && !aMsgs.children.length) aDire(`<p>Bonjour ! Je suis ${esc(ASSISTANT.nom)}. Je peux te présenter les romans, t'expliquer comment acheter et lire, et te rappeler les règles.</p><p>Que veux-tu savoir ?</p>`);
}

function trouverRoman(t) {
  const mq = mots(t); let best = null, sc = 0;
  ROMANS.forEach(r => {
    const mt = mots(r.titre), n = mt.filter(w => mq.includes(w)).length, s = mt.length ? n / mt.length : 0;
    if (n > 0 && s > sc) { sc = s; best = r; }
  });
  return sc >= .5 ? best : null;
}

function aRepondre(t) {
  const q = norm(t), a = (...m) => m.some(x => q.includes(x));
  const wa = `https://wa.me/${CONFIG.whatsapp}`;
  const r = trouverRoman(t);
  if (r) {
    const res = r.resume ? esc(r.resume).replace(/\n/g, "<br>") : "Le résumé détaillé arrive bientôt.";
    return `<p><b>${esc(r.titre)}</b>${r.sousTitre ? "<br><i>" + esc(r.sousTitre) + "</i>" : ""}</p><p>${res}</p><p>${prix(r.prix)} · <a href="#/${r.id}">Voir la fiche et l'extrait gratuit</a></p><p>Je ne dévoile jamais la fin.</p>`;
  }
  if (a("spoil", "la fin", "denouement")) return "<p>Je ne dévoile jamais la fin d'un roman. Je peux te donner son résumé sans spoiler : dis-moi le titre.</p>";
  if (a("regle", "interdit", "restriction", "partage", "pdf", "copier", "pirat", "droit", "procedure", "faut-il", "ne pas")) return "<p>À respecter :</p><ul>" + ASSISTANT.regles.map(x => `<li>${esc(x)}</li>`).join("") + "</ul>";
  if (a("acheter", "achat", "payer", "paiement", "prix", "combien", "mobile money", "momo")) return `<p>${mini === Math.max(...ROMANS.map(x => x.prix)) ? "Chaque roman coûte" : "Les romans coûtent à partir de"} ${prix(mini)}.</p><p>${esc(ASSISTANT.achat)}</p>`;
  if (a("lire", "extrait", "gratuit", "lecture")) return `<p>${esc(ASSISTANT.lecture)}</p><p>Choisis un roman :</p>${liste()}`;
  if (a("contact", "whatsapp", "aide", "probleme", "bug", "auteur", "benoli")) return `<p>Pour parler à Benoli : <a href="${wa}" target="_blank" rel="noopener">WhatsApp</a>.</p>`;
  if (a("recommande", "conseille", "suggere", "que lire", "quoi lire", "genre", "theme", "amour", "histoire")) {
    const mq = mots(t).filter(w => w.length >= 5);
    const t1 = ROMANS.filter(x => mq.some(w => norm(x.resume + " " + x.genre).includes(w)));
    if (t1.length) return "<p>Ça pourrait te plaire :</p><ul>" + t1.map(x => `<li>${lien(x)}</li>`).join("") + "</ul>";
    return `<p>Voici les romans de Benoli. Touche un titre pour lire le résumé et l'extrait gratuit :</p>${liste()}`;
  }
  if (a("liste", "catalogue", "romans", "quels", "titres", "disponible")) return `<p>Les romans de Benoli :</p>${liste()}`;
  if (a("bonjour", "salut", "bonsoir", "hello", "coucou")) return "<p>Bonjour ! Tu veux découvrir les romans, savoir comment acheter, ou connaître les règles ?</p>";
  return `<p>Je n'ai pas compris. Tu peux écrire le titre d'un roman, ou demander : « quels romans », « comment acheter », « les règles ».</p><p>Pour autre chose : <a href="${wa}" target="_blank" rel="noopener">WhatsApp</a>.</p>`;
}

function aEnvoyer(t) { t = t.trim(); if (!t) return; aUser(t); aDire(aRepondre(t)); }
$("#aTitre").textContent = ASSISTANT.nom;
$("#aBtn").addEventListener("click", () => aOuvrir(true));
$("#aFermer").addEventListener("click", () => aOuvrir(false));
$("#aForm").addEventListener("submit", e => { e.preventDefault(); aEnvoyer(aIn.value); aIn.value = ""; });
aMsgs.addEventListener("click", e => { if (e.target.closest("a")) aOuvrir(false); });
["Quels romans ?", "Comment acheter ?", "Lire un extrait", "Les règles"].forEach(c => {
  const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = c;
  b.addEventListener("click", () => aEnvoyer(c)); $("#aChips").appendChild(b);
});

afficherListe();
route();

/* Installation de l'application (PWA) */
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
