name: Construire APK Android Benoli

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

jobs:
  build:
    name: Générer l’APK installable
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances Capacitor
        run: npm install

      - name: Préparer les fichiers de l’application
        run: |
          mkdir -p www
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' --exclude='www' ./ www/

      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Construire l’APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l’APK installable
        uses: actions/upload-artifact@v4
        with:
          name: Benoli-Litteraire-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
