name: Construire APK Android Benoli

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: write

jobs:
  build:
    name: Générer l’APK installable
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Préparer Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer les dépendances Capacitor
        run: npm install

      - name: Préparer les fichiers de l’application
        run: |
          mkdir -p www
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' --exclude='www' ./ www/

      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Construire l’APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l’APK installable
        uses: actions/upload-artifact@v4
        with:
          name: Benoli-Litteraire-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Préparer le fichier APK public
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Benoli-Litteraire.apk

      - name: Publier une version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0
          name: Benoli Littéraire Android 1.0.0
          draft: false
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: Benoli-Litteraire.apk
